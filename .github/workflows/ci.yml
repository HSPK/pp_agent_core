# Lint, format and test checks.
#
# Runs on pull requests, and on a schedule.
#
# Pull requests: `main` is protected and takes commits through PRs, so a
# push-triggered run would re-test the exact tree the PR already tested.
# `release.yml` calls this same workflow through `workflow_call`, so the
# release path and the merge path cannot drift apart.
#
# Schedule: internal dependencies are constrained with `~=`, so a patch
# release of a sibling reaches users of this package without this package
# being rebuilt. Nothing here is pinned by a lockfile, so each run re-resolves
# and tests against whatever the constraints admit today. Without this, a
# sibling patch that breaks this package would sit undetected until someone
# happened to open a pull request here.
name: ci

on:
  pull_request:
    branches: [main]
  schedule:
    # 05:00 UTC daily. GitHub disables scheduled workflows on repositories with
    # no activity for 60 days, so a silent stop is possible; the run history is
    # the place to confirm it is still firing.
    - cron: "0 5 * * *"
  workflow_call:
  workflow_dispatch:

env:
  UV_VERSION: "0.12.1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      # `--all-groups`: a package may declare dependency groups beyond `dev`
      # (pp-rpc-server puts its client-side integration dependency in `test`),
      # and a plain `uv sync` installs only `dev`, so those tests error out.
      - run: uv sync --all-groups
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: pytest
        run: uv run pytest
