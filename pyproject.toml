[project]
name = "pp-agent-core"
version = "0.1.0"
description = "General-purpose agent with transport abstraction, state management, and attachment support (Python port of @earendil-works/pi-agent-core)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Mario Zechner" }]
maintainers = [{ name = "Hangxing Wei", email = "HSPK@users.noreply.github.com" }]
keywords = ["ai", "agent", "llm", "transport", "state-management", "pi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pp-ai==0.1.0",
    "pp-telemetry==0.1.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/HSPK/pp_agent_core"
Repository = "https://github.com/HSPK/pp_agent_core"
Issues = "https://github.com/HSPK/pp_agent_core/issues"
Upstream = "https://github.com/earendil-works/pi/tree/main/packages/agent"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_agent"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    # Pinned, not floored: `release.yml` gates publishing on `ruff check`, so a
    # new ruff release introducing a rule would block every package's release
    # for a reason unrelated to the release. Bump it deliberately instead.
    "ruff==0.16.3",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# `-n auto` matters: the suite is dominated by tests that wait (real
# `asyncio.sleep` for OAuth device-code polling, retry backoff, subprocess
# timeouts), so wall time was ~2.5x CPU time when run serially. Override
# with `-n0` to debug a single test.
addopts = "-q -n auto"
filterwarnings = ["error::DeprecationWarning:pi_.*"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "\\.\\.\\.$",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008", "SIM108", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
